---
run:
  timeout: 3m
  test: false

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - lll
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    enable-all: true
    disable:
      - fieldalignment

run:
  timeout: 3m
  test: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
