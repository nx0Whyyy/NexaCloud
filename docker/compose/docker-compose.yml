name: nexacloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexacloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nexacloud
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacloud -d nexacloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  orchestrator:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      NEXA_ADMIN_USERNAME: ${NEXA_ADMIN_USERNAME:-}
      NEXA_ADMIN_EMAIL: ${NEXA_ADMIN_EMAIL:-}
      NEXA_ADMIN_PASSWORD: ${NEXA_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  scheduler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: scheduler
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    networks: [backend]

  registry:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: registry
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      API_PORT: 8081
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/v1/services"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  monitoring:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: monitoring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      API_PORT: 8082
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ORCHESTRATOR_URL: http://orchestrator:8080/healthz
      REGISTRY_URL: http://registry:8081/api/v1/services
      REDIS_ADDRESS: redis:6379
      NATS_ADDRESS: nats:4222
      GITHUB_REPOSITORY: nx0Whyyy/NexaCloud
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
      registry:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@nexastudio.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  natsdata:
  caddydata:
  caddyconfig:
