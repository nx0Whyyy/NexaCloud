version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexacloud
      POSTGRES_PASSWORD: nexacloud
      POSTGRES_DB: nexacloud
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["nats-server", "--jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222
    ports:
      - "8080:8080"

  scheduler:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: scheduler
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222

  registry:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: registry
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222

volumes:
  pgdata:
  redisdata:
